<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <h1>Currency Explorer</h1>
    
    <div class="form-group">
      <label for="cantidad">Cantidad:</label>
      <input type="number" id="cantidad" value="100" min="1">
    </div>

    <div class="form-group">
      <label for="origen">De:</label>
      <select id="origen">
        <option value="EUR">EUR - Euro</option>
        <option value="USD">USD - Dólar Estadounidense</option>
        <option value="MXN" selected>MXN - Peso Mexicano</option>
        <option value="GBP">GBP - Libra Esterlina</option>
      </select>
    </div>

    <!-- Misión 06: Botón de intercambio (Swap) -->
    <div class="form-group">
      <button id="swap" type="button">⇄ Intercambiar</button>
    </div>

    <div class="form-group">
      <label for="destino">A:</label>
      <select id="destino">
        <option value="EUR">EUR - Euro</option>
        <option value="USD" selected>USD - Dólar Estadounidense</option>
        <option value="MXN">MXN - Peso Mexicano</option>
        <option value="GBP">GBP - Libra Esterlina</option>
      </select>
    </div>

    <button id="consultar">Convertir</button>

    <p id="resultado">Presiona el botón para calcular...</p>
  </main>

  <script src="js/code.js"></script>
</body>
</html>
